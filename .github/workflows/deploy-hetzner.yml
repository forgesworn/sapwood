name: Deploy to Hetzner

# Deploys the built SPA to sapwood.forgesworn.dev on the shared `stall` routing host.
# Additive and tenant-isolated: only ever rsyncs into /opt/sapwood. The Caddy
# vhost (deploy/sapwood.Caddyfile) is installed once by hand — see deploy/README.md.
#
# Requires repo secret HETZNER_SSH_KEY (a private key whose public half is in the
# box's deploy@ authorized_keys). Until that secret exists this workflow no-ops.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sapwood-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Self-contained gate: a direct push to main must not deploy untested
      # code just because no PR ran CI first.
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Deploy to Hetzner (sapwood.forgesworn.dev)
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ]; then
            echo "HETZNER_SSH_KEY not set — skipping deploy (set the secret to enable)."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys for stall (62.238.98.53), verified against the
          # operator's existing known_hosts trust record after the 2026-08-29
          # migration from the retired Hetzner address. Never use a per-run
          # ssh-keyscan here: TOFU could redirect the rsync.
          cat > ~/.ssh/known_hosts <<'EOF'
          62.238.98.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINr4gdIzT/1x6isUAmLfoap8d6TPF/3OJjVsjtyhnxx9
          62.238.98.53 ssh-rsa 
          62.238.98.53 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNlArhQaGuK2A5GeEZ4NT01oTFMc0Dl8S4Um1lJRWmepniOQDEaBrQduoxofjOc5o6bW7w+8KB92A4OAYQU/C1k=
          EOF
          # Firmware binaries are committed under public/firmware/ (so the build
          # includes them in dist/), and deploy with everything else.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ deploy@62.238.98.53:/opt/sapwood/
