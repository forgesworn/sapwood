<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Set up and manage a Heartwood ESP32 signing device from the browser using USB, Wi-Fi, or a local bridge."
    />
    <meta name="theme-color" content="#050505" />
    <meta property="og:title" content="Sapwood -- Shape your signer" />
    <meta
      property="og:description"
      content="Set up and manage a Heartwood ESP32 signing device from the browser."
    />
    <meta property="og:type" content="website" />
    <title>Sapwood -- Shape your signer</title>
    <!-- The bridge API bearer token is deliberately NOT templated into this
         page. heartwoodd serves Sapwood statically and leaves the placeholder
         below literal: injecting the real token at serve time let any
         unauthenticated LAN client fetch `/` and lift full API authority
         (see heartwoodd/src/api.rs). Sapwood treats the literal placeholder
         as "no token" and prompts the operator to enter it; entered tokens are
         stored per-origin and only ever sent back to that origin (http.ts). -->
    <meta name="heartwood-api-token" content="__HEARTWOOD_API_TOKEN__" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS ignores SVG icons for the home screen; it wants this PNG. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
